<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fire Fight</title>
    <link rel="icon" type="image/png" href="/firefightfavicon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #14151c;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #scene-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background:
          radial-gradient(circle at 72% 28%, rgba(229, 63, 26, 0.24), transparent 34rem),
          linear-gradient(135deg, #07080b 0%, #13151a 52%, #22100b 100%);
      }
      /* The landing is the in-game marquee, verbatim: the FIRE FIGHT sign
         breathing in its pool of red, on black, one button beneath. */
      .landing {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(28px, 6vh, 56px);
        padding: clamp(16px, 5vw, 48px);
        box-sizing: border-box;
        background: #000;
        transition:
          opacity 220ms ease,
          visibility 220ms ease;
      }
      .landing__logo-wrap {
        position: relative;
        display: grid;
        place-items: center;
      }
      .landing__logo {
        position: relative;
        z-index: 1;
        width: min(82vw, 620px);
        height: auto;
      }
      /* The ACTIVE red glow behind the sign — the same breathing pool the
         menu banner sits in: a wide haze under a hotter core. */
      .landing__glow {
        position: absolute;
        width: 130%;
        aspect-ratio: 3 / 2.4;
        border-radius: 50%;
        pointer-events: none;
        background:
          radial-gradient(circle, rgba(255, 42, 16, 0.5) 0%, rgba(255, 42, 16, 0.22) 34%, rgba(255, 42, 16, 0) 62%),
          radial-gradient(circle, rgba(196, 18, 8, 0.42) 0%, rgba(196, 18, 8, 0.18) 48%, rgba(196, 18, 8, 0) 72%);
        filter: blur(4px);
        animation: landing-breathe 2.6s ease-in-out infinite;
      }
      @keyframes landing-breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .landing__glow {
          animation: none;
        }
      }
      .enter-vr {
        width: min(100%, 280px);
        min-height: 68px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        box-sizing: border-box;
        padding: 0 34px;
        color: #120906;
        background: linear-gradient(180deg, #ffb35c 0%, #f25b24 100%);
        box-shadow:
          0 18px 48px rgba(242, 91, 36, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
        cursor: pointer;
        font: 900 1.08rem/1 system-ui, -apple-system, sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .enter-vr:hover,
      .enter-vr:focus-visible {
        transform: translateY(-1px);
        box-shadow:
          0 24px 58px rgba(242, 91, 36, 0.34),
          inset 0 1px 0 rgba(255, 255, 255, 0.56);
      }
      .enter-vr:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.78);
        outline-offset: 4px;
      }
      .enter-vr:disabled {
        cursor: wait;
        opacity: 0.72;
        transform: none;
      }
      body.app-entered .landing {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @media (max-width: 700px) {
        .landing__logo {
          width: min(92vw, 620px);
        }
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <section class="landing" id="landing" aria-label="Fire Fight">
      <div class="landing__logo-wrap">
        <div class="landing__glow" aria-hidden="true"></div>
        <img class="landing__logo" src="/signs/fire-fight.png" alt="FIRE FIGHT" />
      </div>
      <button class="enter-vr" id="enter-vr" type="button">Enter VR</button>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
